async function api(p,b){const r=await fetch("/api/"+p,{method:b===undefined?"GET":"POST",headers:b===undefined?{}:{"Content-Type":"application/json"},body:b===undefined?undefined:JSON.stringify(b),credentials:"same-origin"});let d={};try{d=await r.json()}catch(e){}
 if(r.status===401&&me&&(d.error==="session_replaced"||d.error==="auth")){forceLogout(d.error==="session_replaced"?"Your account was opened on another device, so this session was signed out.":"Your session ended. Please log in again.");throw new Error("auth")}

function save(){clearTimeout(pushT);setSync("Saving…");pushT=setTimeout(()=>{pushT=null;push()},400)}
async function flush(){clearTimeout(pushT);pushT=null;await push()}
async function push(){if(!me)return;const changes=[],deletes=[];
 for(const c in COLS){const cur=new Map(db[c].map(x=>[kOf(c,x),JSON.stringify(x)]));
  for(const[k,j]of cur)if(last[c+"/"+k]!==j)changes.push({c,k,j,base:last[c+"/"+k]||null});
  for(const key of Object.keys(last))if(key.startsWith(c+"/")&&!cur.has(key.slice(c.length+1)))deletes.push({c,k:key.slice(c.length+1)})}
 if(!changes.length&&!deletes.length){setSync("All changes saved");return}
 try{const r=await api("push",{changes,deletes});let bad=0;
  for(const x of r.results){if(x.err){bad++;continue}last[x.c+"/"+x.k]=x.j;const i=db[x.c].findIndex(y=>kOf(x.c,y)===x.k);if(i>=0)db[x.c][i]=JSON.parse(x.j)}
  for(const x of r.deleted||[])delete last[x.c+"/"+x.k];
  setSync(bad?"Some changes were not allowed":"All changes saved",!!bad)}catch(e){if(e.message!=="auth")setSync("Could not save: "+e.message,1)}}
async function pull(force){if(!force&&Date.now()-pulled<4000)return;if(me)await flush();pulled=Date.now();
 try{const r=await api("pull");CFG=r.cfg||{};for(const c in COLS){for(const key of Object.keys(last))if(key.startsWith(c+"/"))delete last[key];
  db[c]=(r.db[c]||[]).map(x=>{last[c+"/"+kOf(c,x)]=JSON.stringify(x);return x}).sort((a,b)=>String(a._k||a.id).localeCompare(String(b._k||b.id)))}
  setSync(me?"Connected":"")}catch(e){if(e.message!=="auth")setSync("Could not load data. Check your connection.",1)}}
